<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VideoAI Pro - Móvil</title>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
    color: #fff; min-height: 100vh;
    padding: 15px; padding-bottom: 100px;
  }
  
  header {
    text-align: center; padding: 20px 10px;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 2rem; font-weight: 800;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p { color: #888; font-size: 0.9rem; margin-top: 5px; }
  
  .panel {
    background: rgba(20, 20, 30, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px; margin-bottom: 15px;
  }
  .panel h2 {
    font-size: 1.2rem; margin-bottom: 15px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h2 .num {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 700;
  }

  label {
    display: block; margin: 12px 0 6px;
    font-weight: 600; color: #ccc; font-size: 0.9rem;
  }
  input, select, textarea {
    width: 100%; padding: 12px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; color: #fff; font-size: 15px;
    -webkit-appearance: none;
  }
  textarea { min-height: 100px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #a855f7;
  }

  .btn-primary {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    margin-top: 15px;
    box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; }

  .preview-container {
    aspect-ratio: 16/9; background: #000;
    border-radius: 12px; overflow: hidden;
    position: relative; margin-bottom: 15px;
  }
  .preview-container video {
    width: 100%; height: 100%; object-fit: contain;
  }
  .subtitle-overlay {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.9);
    color: #fff; padding: 8px 16px;
    border-radius: 8px; font-size: 1rem;
    max-width: 90%; text-align: center;
    font-weight: 600; display: none;
  }
  .subtitle-overlay.active { display: block; }

  .progress-container {
    background: rgba(0,0,0,0.4);
    border-radius: 12px; padding: 15px;
    margin-top: 15px; display: none;
  }
  .progress-container.active { display: block; }
  .progress-bar {
    width: 100%; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px; overflow: hidden;
    margin: 10px 0;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #a855f7, #ec4899);
    transition: width 0.3s;
  }
  .progress-text {
    font-size: 0.85rem; color: #aaa;
    display: flex; justify-content: space-between;
  }

  .status {
    padding: 12px; border-radius: 10px;
    margin-top: 12px; font-size: 0.9rem;
    display: none;
  }
  .status.active { display: block; }
  .status.info { background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4); }
  .status.error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); }
  .status.success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); }

  .downloads {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-top: 15px;
  }
  .download-card {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(236, 72, 153, 0.15));
    border: 1px solid rgba(168, 85, 247, 0.3);
    padding: 15px; border-radius: 12px;
    text-align: center;
  }
  .download-card .icon { font-size: 2rem; margin-bottom: 5px; }
  .download-card .name { font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; }
  .download-card button {
    width: 100%; padding: 10px;
    background: rgba(255,255,255,0.1);
    color: #fff; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; font-size: 0.85rem;
    font-weight: 600; cursor: pointer;
  }
  .download-card button:active { background: rgba(255,255,255,0.2); }

  .info-box {
    background: rgba(59, 130, 246, 0.15);
    border-left: 3px solid #3b82f6;
    padding: 12px; border-radius: 8px;
    margin-bottom: 15px; font-size: 0.85rem;
    color: #bbb; line-height: 1.5;
  }
  .info-box a { color: #60a5fa; font-weight: 600; }

  .scenes-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-top: 15px;
  }
  .scene-card {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 8px;
    font-size: 0.8rem;
  }
  .scene-card img {
    width: 100%; aspect-ratio: 16/9;
    object-fit: cover; border-radius: 6px;
    margin-bottom: 6px;
  }
  .scene-card .scene-num {
    font-weight: 700; color: #a855f7;
    font-size: 0.7rem; margin-bottom: 3px;
  }
  .scene-card .scene-text {
    color: #ccc; line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .loader {
    border: 3px solid rgba(255,255,255,0.1);
    border-top: 3px solid #a855f7;
    border-radius: 50%; width: 30px; height: 30px;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🎬 VideoAI Pro</h1>
  <p>Generador profesional para móvil</p>
</header>

<div class="panel">
  <h2><span class="num">1</span>Configura tu video</h2>
  
  <div class="info-box">
    💡 Necesitas API key gratuita de Gemini.<br>
    Obténla en: <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a>
  </div>

  <label>🔑 API Key de Gemini</label>
  <input type="password" id="geminiKey" placeholder="AIza...">

  <label>📝 Prompt / Tema</label>
  <textarea id="prompt" placeholder="Ej: La historia de los dinosaurios, desde su aparición hasta su extinción"></textarea>

  <label>Duración</label>
  <select id="duration">
    <option value="30">30 segundos (6 escenas)</option>
    <option value="60" selected>60 segundos (12 escenas)</option>
  </select>

  <label>🎤 Voz</label>
  <select id="voice">
    <option value="es-ES-ElviraNeural">Español España - Elvira</option>
    <option value="es-MX-DaliaNeural">Español México - Dalia</option>
    <option value="en-US-JennyNeural">English - Jenny</option>
  </select>

  <label>🎨 Estilo</label>
  <select id="style">
    <option value="cinematic, photorealistic, 4k">Cinematográfico</option>
    <option value="anime style, vibrant">Anime</option>
    <option value="3d render, octane">3D Realista</option>
  </select>

  <button class="btn-primary" id="generateBtn">🚀 Generar Video</button>
  <div class="status" id="status"></div>
</div>

<div class="panel progress-container" id="progressPanel">
  <h2>⚙️ Progreso</h2>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text">
    <span id="progressLabel">Iniciando...</span>
    <span id="progressPercent">0%</span>
  </div>
</div>

<div class="panel" id="scenesPanel" style="display:none;">
  <h2><span class="num">2</span>Escenas</h2>
  <div class="scenes-grid" id="scenesGrid"></div>
</div>

<div class="panel" id="finalPanel" style="display:none;">
  <h2><span class="num">3</span>Video final</h2>
  
  <div class="preview-container">
    <video id="finalVideo" controls playsinline></video>
    <div class="subtitle-overlay" id="subtitleOverlay"></div>
  </div>

  <div class="downloads">
    <div class="download-card">
      <div class="icon">🎬</div>
      <div class="name">Video MP4</div>
      <button id="downloadVideo">⬇️ Descargar</button>
    </div>
    <div class="download-card">
      <div class="icon">🎤</div>
      <div class="name">Audio</div>
      <button id="downloadAudio">⬇️ Descargar</button>
    </div>
    <div class="download-card">
      <div class="icon">💬</div>
      <div class="name">Subtítulos</div>
      <button id="downloadSubs">⬇️ Descargar</button>
    </div>
    <div class="download-card">
      <div class="icon">🔄</div>
      <div class="name">Nuevo</div>
      <button id="newVideo">✨ Otro</button>
    </div>
  </div>
</div>

<script>
// Mismo código JavaScript que antes, pero optimizado para móvil
const CONFIG = {
  geminiModel: "gemini-2.0-flash",
  imageWidth: 854,  // Más pequeño para móvil (más rápido)
  imageHeight: 480,
  fps: 24,
  sceneDuration: 5,
};

let state = { scenes: [], audioBlob: null, subtitles: [], videoBlob: null, ffmpeg: null };

const $ = (id) => document.getElementById(id);

function setStatus(msg, type = "info") {
  const el = $("status");
  el.className = `status active ${type}`;
  el.innerHTML = msg;
}

function setProgress(percent, label) {
  $("progressFill").style.width = percent + "%";
  $("progressPercent").textContent = Math.round(percent) + "%";
  if (label) $("progressLabel").textContent = label;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Funciones de generación (iguales que antes pero con resolución móvil)
async function divideIntoScenes(prompt, duration, style) {
  setProgress(5, "🧠 Creando guion...");
  const numScenes = Math.round(duration / CONFIG.sceneDuration);
  
  const systemPrompt = `Divide en ${numScenes} escenas. JSON: {"scenes":[{"visual":"descripción en inglés","narration":"texto a narrar"}]}`;

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.geminiModel}:generateContent?key=${$("geminiKey").value}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: { temperature: 0.8, responseMimeType: "application/json" }
      })
    }
  );

  const data = await response.json();
  return JSON.parse(data.candidates[0].content.parts[0].text).scenes;
}

async function generateImage(prompt, style) {
  const fullPrompt = `${prompt}, ${style}`;
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=${CONFIG.imageWidth}&height=${CONFIG.imageHeight}&nologo=true`;
  
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve({ url, img });
    img.onerror = () => reject(new Error("Error imagen"));
    img.src = url;
  });
}

async function generateAllImages(scenes, style) {
  $("scenesPanel").style.display = "block";
  const grid = $("scenesGrid");
  grid.innerHTML = "";
  
  scenes.forEach((scene, i) => {
    const card = document.createElement("div");
    card.className = "scene-card";
    card.id = `scene-${i}`;
    card.innerHTML = `<div class="scene-num">ESCENA ${i + 1}</div><div class="scene-text">${scene.narration}</div>`;
    grid.appendChild(card);
  });

  for (let i = 0; i < scenes.length; i++) {
    const percent = 15 + (i / scenes.length) * 40;
    setProgress(percent, `🎨 Imagen ${i + 1}/${scenes.length}...`);
    
    try {
      const result = await generateImage(scenes[i].visual, style);
      const card = $(`scene-${i}`);
      card.innerHTML = `<img src="${result.url}"><div class="scene-num">ESCENA ${i + 1}</div><div class="scene-text">${scenes[i].narration}</div>`;
      scenes[i].image = result.img;
    } catch (err) {
      console.error(err);
    }
  }
  
  return scenes;
}

async function generateVoice(text, voice) {
  const url = `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodeURIComponent(text)}`;
  const response = await fetch(url);
  return await response.blob();
}

async function generateAllVoices(scenes, voice) {
  const audioBlobs = [];
  for (let i = 0; i < scenes.length; i++) {
    const percent = 55 + (i / scenes.length) * 20;
    setProgress(percent, `🎤 Voz ${i + 1}/${scenes.length}...`);
    try {
      const blob = await generateVoice(scenes[i].narration, voice);
      audioBlobs.push(blob);
    } catch (err) {
      audioBlobs.push(null);
    }
    await sleep(300);
  }
  return audioBlobs;
}

async function initFFmpeg() {
  if (state.ffmpeg) return state.ffmpeg;
  const { FFmpeg } = FFmpegWASM;
  const ffmpeg = new FFmpeg();
  const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
  await ffmpeg.load({
    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
  });
  state.ffmpeg = ffmpeg;
  return ffmpeg;
}

async function renderVideo(scenes, audioBlobs) {
  setProgress(75, "🎬 Iniciando FFmpeg...");
  const ffmpeg = await initFFmpeg();
  const { fetchFile } = FFmpegUtil;
  
  const framesPerScene = CONFIG.sceneDuration * CONFIG.fps;
  let frameIndex = 0;
  
  for (let i = 0; i < scenes.length; i++) {
    if (!scenes[i].image) continue;
    const percent = 75 + (i / scenes.length) * 15;
    setProgress(percent, `🖼️ Escena ${i + 1}/${scenes.length}...`);
    
    const canvas = document.createElement("canvas");
    canvas.width = CONFIG.imageWidth;
    canvas.height = CONFIG.imageHeight;
    const ctx = canvas.getContext("2d");
    
    for (let f = 0; f < framesPerScene; f++) {
      const progress = f / framesPerScene;
      const zoom = 1 + progress * 0.1;
      
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const img = scenes[i].image;
      const scale = Math.max(canvas.width / img.width, canvas.height / img.height) * zoom;
      const w = img.width * scale;
      const h = img.height * scale;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;
      
      ctx.drawImage(img, x, y, w, h);
      
      const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.9));
      await ffmpeg.writeFile(`frame_${String(frameIndex).padStart(5, "0")}.jpg`, await fetchFile(blob));
      frameIndex++;
    }
  }
  
  setProgress(90, "🎵 Audio...");
  const audioFiles = [];
  for (let i = 0; i < audioBlobs.length; i++) {
    if (audioBlobs[i]) {
      await ffmpeg.writeFile(`audio_${i}.mp3`, await fetchFile(audioBlobs[i]));
      audioFiles.push(`audio_${i}.mp3`);
    }
  }
  
  const frameList = Array.from({length: frameIndex}, (_, i) => `file 'frame_${String(i).padStart(5, "0")}.jpg'`).join("\n");
  await ffmpeg.writeFile("frames.txt", frameList);
  
  if (audioFiles.length > 0) {
    await ffmpeg.writeFile("audiolist.txt", audioFiles.map(f => `file '${f}'`).join("\n"));
    await ffmpeg.exec(["-f", "concat", "-safe", "0", "-i", "audiolist.txt", "-c", "copy", "audio_full.mp3"]);
  }
  
  setProgress(95, "🎞️ Renderizando...");
  await ffmpeg.exec([
    "-f", "concat", "-safe", "0", "-i", "frames.txt",
    "-framerate", CONFIG.fps.toString(),
    "-i", "audio_full.mp3",
    "-c:v", "libx264", "-pix_fmt", "yuv420p",
    "-c:a", "aac", "-b:a", "128k",
    "-shortest", "-preset", "ultrafast",
    "output.mp4"
  ]);
  
  const data = await ffmpeg.readFile("output.mp4");
  return new Blob([data.buffer], { type: "video/mp4" });
}

function generateSubtitles(scenes) {
  const subtitles = [];
  let currentTime = 0;
  scenes.forEach((scene) => {
    subtitles.push({ start: currentTime, end: currentTime + CONFIG.sceneDuration, text: scene.narration });
    currentTime += CONFIG.sceneDuration;
  });
  return subtitles;
}

function subtitlesToSRT(subtitles) {
  return subtitles.map((sub, i) => {
    const formatTime = (s) => {
      const h = Math.floor(s / 3600).toString().padStart(2, '0');
      const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      const ms = Math.floor((s % 1) * 1000).toString().padStart(3, '0');
      return `${h}:${m}:${sec},${ms}`;
    };
    return `${i + 1}\n${formatTime(sub.start)} --> ${formatTime(sub.end)}\n${sub.text}\n`;
  }).join("\n");
}

function showFinalVideo(videoBlob, audioBlob, subtitles) {
  setProgress(100, "✅ ¡Listo!");
  const videoURL = URL.createObjectURL(videoBlob);
  const video = $("finalVideo");
  video.src = videoURL;
  
  const subtitleOverlay = $("subtitleOverlay");
  video.ontimeupdate = () => {
    const current = video.currentTime;
    const active = subtitles.find(s => current >= s.start && current <= s.end);
    if (active) {
      subtitleOverlay.textContent = active.text;
      subtitleOverlay.classList.add("active");
    } else {
      subtitleOverlay.classList.remove("active");
    }
  };
  
  $("downloadVideo").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(videoBlob);
    a.download = "video.mp4";
    a.click();
  };
  $("downloadAudio").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(audioBlob);
    a.download = "audio.mp3";
    a.click();
  };
  $("downloadSubs").onclick = () => {
    const blob = new Blob([subtitlesToSRT(subtitles)], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "subtitulos.srt";
    a.click();
  };
  $("newVideo").onclick = () => location.reload();
  
  $("finalPanel").style.display = "block";
  $("finalPanel").scrollIntoView({ behavior: "smooth" });
}

$("generateBtn").addEventListener("click", async () => {
  const prompt = $("prompt").value.trim();
  const duration = parseInt($("duration").value);
  const voice = $("voice").value;
  const style = $("style").value;
  const geminiKey = $("geminiKey").value.trim();
  
  if (!prompt) return setStatus("⚠️ Escribe un prompt", "error");
  if (!geminiKey) return setStatus("⚠️ Necesitas API key de Gemini", "error");
  
  $("generateBtn").disabled = true;
  $("progressPanel").classList.add("active");
  
  try {
    setStatus("🧠 Paso 1/5: Creando guion...", "info");
    const scenes = await divideIntoScenes(prompt, duration, style);
    
    setStatus("🎨 Paso 2/5: Generando imágenes...", "info");
    const scenesWithImages = await generateAllImages(scenes, style);
    
    setStatus("🎤 Paso 3/5: Generando voz...", "info");
    const audioBlobs = await generateAllVoices(scenes, voice);
    
    setStatus("🎬 Paso 4/5: Renderizando video...", "info");
    const videoBlob = await renderVideo(scenesWithImages, audioBlobs);
    
    setStatus("💬 Paso 5/5: Subtítulos...", "info");
    const subtitles = generateSubtitles(scenes);
    const audioBlob = new Blob(audioBlobs.filter(b => b), { type: "audio/mpeg" });
    
    showFinalVideo(videoBlob, audioBlob, subtitles);
    setStatus("✅ ¡Video completado!", "success");
    
  } catch (err) {
    console.error(err);
    setStatus(`❌ Error: ${err.message}`, "error");
    $("generateBtn").disabled = false;
  }
});

$("geminiKey").addEventListener("input", (e) => {
  localStorage.setItem("gemini_key", e.target.value);
});
$("geminiKey").value = localStorage.getItem("gemini_key") || "";
</script>
</body>
</html>
